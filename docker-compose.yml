version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - GEE_PROJECT_ID=${GEE_PROJECT_ID:-ee-abhinandpsreenivasan1}
      - DATABASE_URL=postgresql://geoserve:geoserve_secret@postgres:5432/geoservedb
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - ./storage_data:/app/storage_data

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - GEE_PROJECT_ID=${GEE_PROJECT_ID:-ee-abhinandpsreenivasan1}
      - DATABASE_URL=postgresql://geoserve:geoserve_secret@postgres:5432/geoservedb
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - ./storage_data:/app/storage_data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgis/postgis:15-3.3-alpine
    environment:
      POSTGRES_USER: geoserve
      POSTGRES_PASSWORD: geoserve_secret
      POSTGRES_DB: geoservedb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2023-09-20T22-40-07Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
